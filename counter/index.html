<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body class="bg-orange-200">
    <h1 class="text-3xl bg-orange-300">hello</h1>
    <div class="flex justify-center items-center h-screen">
        <div class="bg-white p-8 rounded shadow-md">

            <h1 class="text-4xl p-10 m-10">Counter</h1>
            <p class="text-2xl p-10 m-10" id='p1'>0</p>
            <button class="bg-purple-500 hover:bg-purple-800 text-white w-20" onclick="add()">ADD</button>
            <button class="bg-purple-500 hover:bg-purple-800 text-white w-20" onclick="dec()">DEC</button>
            <button class="bg-purple-500 hover:bg-purple-800 text-white w-20" onclick="reset()">RESET</button>
        </div>
    </div>

</body>
<script>
    let count = 0;
    const p1 = document.getElementById('p1');
    function add() {
        count++;
        p1.innerHTML = count;
    }
    function dec() {
        if (count > 0) {
            count--;
            p1.innerHTML = count;
        }
    }
    function reset() {
        count = 0;
        p1.innerHTML = count;
    }
</script>

</html>
