<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration System</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
    <div class="theme-toggle">
        <button id="themeBtn">🌙 Dark Mode</button>
    </div>
    <div class="container">

        <h1>🎓 Student Registration System</h1>

        <!-- Registration Form -->

        <div class="form-container">

            <form id="studentForm">

                <div class="input-group">
                    <label>Student Name</label>
                    <input type="text" id="name" placeholder="Enter Full Name">
                    <small class="error" id="nameError"></small>
                </div>

                <div class="input-group">
                    <label>Roll Number</label>
                    <input type="number" id="roll" placeholder="Enter Roll Number">
                    <small class="error" id="rollError"></small>
                </div>

                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="Enter Email">
                    <small class="error" id="emailError"></small>
                </div>

                <div class="input-group">
                    <label>Phone Number</label>
                    <input type="tel" id="phone" placeholder="Enter Phone Number">
                    <small class="error" id="phoneError"></small>
                </div>

                <div class="input-group">
                    <label>Course</label>

                    <select id="course">
                        <option value="">Select Course</option>
                        <option>B.Tech</option>
                        <option>BCA</option>
                        <option>B.Sc</option>
                        <option>B.Com</option>
                        <option>MCA</option>
                        <option>M.Tech</option>
                    </select>

                    <small class="error" id="courseError"></small>
                </div>

                <div class="input-group">
                    <label>Gender</label>

                    <div class="gender">

                        <label>
                            <input type="radio" name="gender" value="Male">
                            Male
                        </label>

                        <label>
                            <input type="radio" name="gender" value="Female">
                            Female
                        </label>

                        <label>
                            <input type="radio" name="gender" value="Other">
                            Other
                        </label>

                    </div>

                    <small class="error" id="genderError"></small>

                </div>

                <div class="input-group">
                    <label>Date of Birth</label>
                    <input type="date" id="dob">
                    <small class="error" id="dobError"></small>
                </div>

                <div class="input-group">
                    <label>Address</label>
                    <textarea id="address" rows="4" placeholder="Enter Address"></textarea>
                    <small class="error" id="addressError"></small>
                </div>

                <button type="submit" id="submitBtn">
                    Register Student
                </button>

            </form>

        </div>

        <!-- Search -->

        <div class="search-box">

            <input type="text" id="search" placeholder="🔍 Search by Name or Roll Number">

        </div>

        <!-- Student Table -->

        <div class="table-container">

            <table>

                <thead>

                    <tr>
                        <th>Roll No.</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Course</th>
                        <th>Gender</th>
                        <th>DOB</th>
                        <th>Address</th>
                        <th>Action</th>
                    </tr>

                </thead>

                <tbody id="studentTable">

                    <!-- JavaScript will insert rows here -->

                </tbody>

            </table>

        </div>

    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
