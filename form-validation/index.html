<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <form onsubmit="handlesubmit(event)" novalidate>

        <div>
            <label>Name:</label>
            <input type="text" placeholder="Enter your name" required id="f1">
        </div>

        <div>
            <label>Email:</label>
            <input type="email" placeholder="Enter your email" required id="f2">
        </div>

        <div>
            <label>Password:</label>
            <input type="password" placeholder="Enter your password" required id="f3">
        </div>
        <div>
            <label>Confirm Password:</label>
            <input type="password" placeholder="Confirm your password" required id="f4">
        </div>

        <div>
            <input type="submit" value="Submit">
        </div>

    </form>
</body>
<script src="script.js"></script>

</html>
